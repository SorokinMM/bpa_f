<form
  class="login-form"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>

  <label class="login-label">
    Username
    <input
      class="login-input"
      type="text"
      placeholder="Input username"
      formControlName="username"
    >
  </label>
  <label class="login-label">
    Password
    <input
      class="login-input"
      type="password"
      placeholder="Input password"
      formControlName="password"
    >
  </label>
  <button class="login-button" type="submit">Login</button>
</form>
