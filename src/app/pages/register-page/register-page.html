@if (isOpen) {
  <div class="modal-overlay" (click)="close()">
    <div class="modal-form" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Register</h2>
        <button type="button" class="close-btn" (click)="close()">&times;</button>
      </div>
      @if (errorMessage) {
        <div class="error-banner">
          {{errorMessage}}
        </div>
      }
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" )>
        <div class="form-group">
          <label class="register-label" for="username">Username</label>
          <input class="register-input" type="text" id="username" placeholder="Input username" formControlName="username">
        </div>
        <div class="form-group">
          <label class="register-label" for="password">Password: </label>
          <input class="register-input" type="password" id="password" placeholder="Input password" formControlName="password">
        </div>
        <div class="form-group">
          <label class="register-label" for="repeatPassword">Repeat password: </label>
          <input class="register-input" type="password" id="repeatPassword" placeholder="Repeat password" formControlName="repeatPassword">
        </div>
        <button class="register-button" type="submit">Ok</button>
      </form>
    </div>
  </div>

}
